<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薬歴</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<link rel="stylesheet" href="/assets/css/patient.css">
<link rel="stylesheet" href="/assets/css/assist.css">
<link rel="modulepreload" href="/assets/js/patient.js">
<script type="module" src="/assets/js/router.js" data-page="/assets/js/patient.js"></script>
</head>
<body class="app">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <div class="toolbar main-toolbar" id="toolbar">
    <button type="button" class="btn btn-quiet" id="layout-edit"></button>
    <button type="button" class="btn btn-quiet" id="layout-reset" hidden>初期の配置</button>
    <button type="button" class="btn btn-quiet" id="to-logs">閲覧記録</button>
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary btn-icon" id="new-rx" title="新規処方（Alt+N）" aria-label="新規処方"></button>
  </div>
  <main class="pt-grid" id="pt-grid">
    <section class="pbox" data-box="patient">
      <div class="pbox-head">患者</div>
      <div class="pbox-body" id="band"></div>
    </section>
    <section class="pbox warn" data-box="cautions">
      <div class="pbox-head">注意点</div>
      <div class="pbox-body" id="cautions"></div>
    </section>
    <section class="pbox" data-box="next">
      <div class="pbox-head">次に確認すること</div>
      <div class="pbox-body" id="next"></div>
    </section>
    <section class="pbox" data-box="meds">
      <div class="pbox-head">今の処方<span class="sub" id="meds-date"></span></div>
      <div class="pbox-body" id="current-meds"></div>
    </section>
    <section class="pbox" data-box="other">
      <div class="pbox-head">生活・後発品の意向</div>
      <div class="pbox-body" id="other"></div>
    </section>
    <section class="pbox" data-box="labs">
      <div class="pbox-head">検査値・体重</div>
      <div class="pbox-body" id="labs"></div>
    </section>
    <section class="pbox" data-box="memo">
      <div class="pbox-head">メモ帳<span class="sub" id="memo-meta"></span></div>
      <div class="pbox-body memo-body" id="memo"></div>
    </section>
    <section class="pbox" data-box="matrix">
      <div class="pbox-head">処方の推移<span class="sub">薬 × 来局日（右が新しい）</span><span class="spacer"></span>
        <span class="shape-label" id="matrix-shape-label">並べ方</span>
        <div class="seg" role="radiogroup" aria-labelledby="matrix-shape-label" id="matrix-shape">
          <button type="button" role="radio" data-fold="0" title="1つの表。入りきらない古い来局は表を横に送って見る">横に送る</button>
          <button type="button" role="radio" data-fold="1" title="入りきらない来局は下の表へ回す。上の表が新しい">折り返し</button>
        </div>
      </div>
      <div class="pbox-body matrix-view" id="matrix-view"></div>
    </section>
    <section class="pbox" data-box="history" id="history">
      <div class="history-sticky">
      <div class="pbox-head">経過<span class="count" id="visit-count"></span><span class="spacer"></span>
        <span class="shape-label" id="shape-label">並べ方</span>
        <div class="seg" role="radiogroup" aria-labelledby="shape-label" id="history-shape">
          <button type="button" role="radio" data-rows="0" title="横に並べ、入りきらなければ次の行へ">折り返し</button>
          <button type="button" role="radio" data-rows="1" title="1段の帯。左が新しい、右が古い">1段</button>
          <button type="button" role="radio" data-rows="2" title="2段の帯。左が新しい、右が古い">2段</button>
        </div>
      </div>
      <div class="visit-bar" id="visit-bar">
        <div class="handover" id="handover" aria-label="この来局の引き継ぎ"></div>
        <span class="spacer"></span>
        <button type="button" class="btn" id="to-revise" title="選んだ来局の処方を見る・直す（会計の後でも。直す前の内容は残ります）">処方を確認 <kbd>Alt+U</kbd></button>
        <button type="button" class="btn" id="to-inspect" title="この来局の調剤監査（済んだ監査の記録も出ます）">調剤監査</button>
        <button type="button" class="btn" id="to-handbook" title="この来局のお薬手帳（紙に貼る内容・電子版の QR コード）">お薬手帳</button>
        <button type="button" class="btn" id="to-receipt" title="この来局の領収証・明細書（再発行）">領収証・明細書</button>
        <button type="button" class="btn" id="to-tracing">トレーシングレポート <kbd>Alt+T</kbd></button>
      </div>
      </div>
      <div class="pbox-body history-body">
        <div class="timeline" id="timeline" tabindex="0" aria-label="経過（上下の矢印で来局を選ぶ）"></div>
      </div>
    </section>
  </main>
</div>

<dialog id="note-dialog" aria-labelledby="note-dialog-title">
  <form id="note-form" novalidate>
    <div class="panel-head" id="note-dialog-title">患者メモ</div>
    <div class="dialog-body">
      <div class="field">
        <span class="label" id="note-category-label">分類</span>
        <div class="radio-row wrap" role="radiogroup" aria-labelledby="note-category-label" id="note-categories"></div>
        <span class="error-text" data-error="category"></span>
      </div>
      <div class="field">
        <label class="label" for="note-body">内容</label>
        <textarea class="input textarea" id="note-body" name="body" rows="10" maxlength="2000" placeholder="分類を選ぶと、その分類の今の内容が出ます"></textarea>
        <span class="error-text" data-error="body"></span>
        <ul class="note-history" id="note-history" aria-label="前の内容"></ul>
      </div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button>
      <button type="submit" class="btn btn-primary">保存 <kbd>Ctrl+Enter</kbd></button>
    </div>
  </form>
</dialog>
<dialog id="record-dialog" class="wide assist-dialog" aria-labelledby="record-dialog-title">
  <form id="record-form" novalidate>
    <div class="panel-head" id="record-dialog-title">指導記録を記載</div>
    <div class="assist-layout">
    <div class="dialog-body">
      <div class="record-context" id="record-context"></div>
      <div class="record-tools">
        <button type="button" class="btn btn-small" id="make-draft" title="会話の文字起こし・処方の変化・検査値・指導内容の提案から S・O・A・P を組み立てる">下書きを作る <kbd>Alt+G</kbd></button>
        <label class="hint" for="template-select">テンプレート</label>
        <select class="input input-small" id="template-select"></select>
        <button type="button" class="btn btn-small" id="apply-template">写す</button>
        <button type="button" class="btn btn-ghost btn-small" id="save-template">今の内容をテンプレートに</button>
        <span class="tag tag-warn" id="drafted-tag" hidden>下書きから</span>
      </div>
      <div class="soap-grid" id="soap-fields"></div>
      <div class="record-checks">
        <div class="field">
          <span class="label" id="leftover-label">残薬</span>
          <div class="radio-row" role="radiogroup" aria-labelledby="leftover-label" id="leftover"></div>
        </div>
      </div>
      <span class="error-text" data-error="subjective"></span>
    </div>
    <aside class="assist" id="assist">
      <section class="assist-block" id="conv-block">
        <h3>服薬指導の会話</h3>
        <div class="conv-actions">
          <button type="button" class="btn btn-small" id="rec-toggle"></button>
          <span class="rec-time num" id="rec-time" hidden></span>
          <button type="button" class="btn btn-small" id="rec-file-btn">録音ファイルを読み込む</button><input type="file" id="rec-file" accept="audio/*" hidden>
        </div>
        <div class="transcript" id="transcript" hidden></div>
        <div class="extracted" id="extracted" hidden></div>
      </section>
      <section class="assist-block">
        <h3>指導内容の提案</h3>
        <ul class="suggestions" id="suggestions"></ul>
      </section>
      <section class="assist-block" id="line-block" hidden>
        <h3>つながる薬局のメッセージ</h3>
        <ul class="line-list" id="line-list"></ul>
      </section>
    </aside>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button>
      <button type="submit" class="btn btn-primary">保存 <kbd>Ctrl+Enter</kbd></button>
    </div>
  </form>
</dialog>
<dialog id="lab-dialog" class="wide" aria-labelledby="lab-dialog-title">
  <form id="lab-form" novalidate>
    <div class="panel-head" id="lab-dialog-title">検査値・体重を入力</div>
    <div class="dialog-body">
      <div class="lab-top">
        <div class="field">
          <label for="lab-date">検査日・測定日</label>
          <input class="input" type="date" max="9999-12-31" id="lab-date" name="measuredOn">
          <span class="error-text" data-error="measuredOn"></span>
        </div>
        <button type="button" class="btn" id="lab-photo-btn">用紙を撮影</button><input type="file" id="lab-photo" accept="image/*" capture="environment" hidden>
        <span class="tag tag-warn" id="lab-photo-tag" hidden>読み取った値</span>
      </div>
      <div class="lab-grid" id="lab-grid"></div>
      <span class="error-text" data-error="values"></span>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button>
      <button type="submit" class="btn btn-primary">保存 <kbd>Ctrl+Enter</kbd></button>
    </div>
  </form>
</dialog>
</body>
</html>
