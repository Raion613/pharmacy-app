<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薬歴</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<link rel="stylesheet" href="/assets/css/patient.css">
<link rel="stylesheet" href="/assets/css/assist.css">
<script type="module" src="/assets/js/patient.js"></script>
</head>
<body class="app">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <nav class="crumbs"></nav>
  <section class="panel patient-band band-top" id="band"></section>
  <main class="content split">
    <aside class="panel summary" id="summary">
      <div class="panel-head">この患者の要点<span class="spacer"></span><button type="button" class="btn btn-small" id="add-lab">検査値 <kbd>Alt+L</kbd></button><button type="button" class="btn btn-small" id="add-note">メモ <kbd>Alt+M</kbd></button></div>
      <div class="summary-body" id="summary-body"></div>
    </aside>
    <section class="panel history" id="history">
      <div class="panel-head history-head">
        <div class="tabs" role="tablist" aria-label="薬歴の表示">
          <button type="button" role="tab" id="tab-timeline" aria-controls="timeline" aria-selected="true">経過</button>
          <button type="button" role="tab" id="tab-matrix" aria-controls="matrix-view" aria-selected="false" tabindex="-1">処方の推移</button>
        </div>
        <span class="count" id="visit-count"></span>
      </div>
      <div class="timeline" id="timeline" role="tabpanel" aria-labelledby="tab-timeline" tabindex="0"></div>
      <div class="matrix-view" id="matrix-view" role="tabpanel" aria-labelledby="tab-matrix" hidden></div>
    </section>
  </main>
  <footer class="actionbar">
    <div class="keys"><span><kbd>↑</kbd><kbd>↓</kbd>来局を選ぶ</span><span><kbd>Alt</kbd>+<kbd>K</kbd>指導記録を記載</span><span><kbd>Alt</kbd>+<kbd>M</kbd>メモを追加</span><span><kbd>Alt</kbd>+<kbd>L</kbd>検査値</span><span><kbd>Alt</kbd>+<kbd>T</kbd>トレーシングレポート</span></div>
    <span class="spacer"></span>
    <a class="btn" id="to-logs">閲覧記録</a>
    <a class="btn" id="to-tracing">トレーシングレポート <kbd>Alt+T</kbd></a>
    <button type="button" class="btn" id="do-rx" disabled>選んだ処方でDo <kbd>Alt+D</kbd></button>
    <a class="btn btn-primary" id="new-rx">新規処方 <kbd>Alt+N</kbd></a>
  </footer>
</div>

<dialog id="note-dialog" aria-labelledby="note-dialog-title">
  <form id="note-form" novalidate>
    <div class="panel-head" id="note-dialog-title">患者メモを追加</div>
    <div class="dialog-body">
      <div class="field">
        <span class="label" id="note-category-label">分類</span>
        <div class="radio-row wrap" role="radiogroup" aria-labelledby="note-category-label" id="note-categories"></div>
        <span class="error-text" data-error="category"></span>
      </div>
      <div class="field">
        <label for="note-body">内容</label>
        <textarea class="input textarea" id="note-body" name="body" rows="4" maxlength="300" placeholder="例：セフェム系抗菌薬で発疹（2019年、他院）"></textarea>
        <span class="hint counter" data-counter="note-body"></span>
        <span class="error-text" data-error="body"></span>
      </div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button>
      <button type="submit" class="btn btn-primary">追加 <kbd>Ctrl+Enter</kbd></button>
    </div>
  </form>
</dialog>

<dialog id="record-dialog" class="wide assist-dialog" aria-labelledby="record-dialog-title">
  <form id="record-form" novalidate>
    <div class="panel-head" id="record-dialog-title">指導記録を記載</div>
    <div class="assist-layout">
    <div class="dialog-body">
      <div class="record-context" id="record-context"></div>
      <div class="record-tools">
        <button type="button" class="btn btn-small" id="make-draft" title="会話の文字起こし・処方の変化・検査値・指導内容の提案から S・O・A・P を組み立てる">下書きを作る <kbd>Alt+G</kbd></button>
        <label class="hint" for="template-select">テンプレート</label>
        <select class="input input-small" id="template-select"></select>
        <button type="button" class="btn btn-small" id="apply-template">写す</button>
        <button type="button" class="btn btn-ghost btn-small" id="save-template">今の内容をテンプレートに</button>
        <span class="tag tag-warn" id="drafted-tag" hidden>下書きから</span>
      </div>
      <div class="soap-grid" id="soap-fields"></div>
      <div class="record-checks">
        <div class="field">
          <span class="label" id="leftover-label">残薬</span>
          <div class="radio-row" role="radiogroup" aria-labelledby="leftover-label" id="leftover"></div>
        </div>
        <div class="field">
          <span class="label" id="notebook-label">お薬手帳</span>
          <div class="radio-row" role="radiogroup" aria-labelledby="notebook-label" id="notebook"></div>
        </div>
      </div>
      <span class="error-text" data-error="subjective"></span>
    </div>
    <aside class="assist" id="assist">
      <section class="assist-block" id="conv-block">
        <h3>服薬指導の会話</h3>
        <div class="conv-actions">
          <button type="button" class="btn btn-small" id="rec-toggle"></button>
          <span class="rec-time num" id="rec-time" hidden></span>
          <button type="button" class="btn btn-small" id="rec-file-btn">録音ファイルを読み込む</button><input type="file" id="rec-file" accept="audio/*" hidden>
        </div>
        <div class="transcript" id="transcript" hidden></div>
        <div class="extracted" id="extracted" hidden></div>
      </section>
      <section class="assist-block">
        <h3>指導内容の提案</h3>
        <ul class="suggestions" id="suggestions"></ul>
      </section>
      <section class="assist-block" id="line-block" hidden>
        <h3>つながる薬局のメッセージ</h3>
        <ul class="line-list" id="line-list"></ul>
      </section>
    </aside>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button>
      <button type="submit" class="btn btn-primary">保存 <kbd>Ctrl+Enter</kbd></button>
    </div>
  </form>
</dialog>
<dialog id="lab-dialog" class="wide" aria-labelledby="lab-dialog-title">
  <form id="lab-form" novalidate>
    <div class="panel-head" id="lab-dialog-title">検査値・体重を入力</div>
    <div class="dialog-body">
      <div class="lab-top">
        <div class="field">
          <label for="lab-date">検査日・測定日</label>
          <input class="input" type="date" id="lab-date" name="measuredOn">
          <span class="error-text" data-error="measuredOn"></span>
        </div>
        <button type="button" class="btn" id="lab-photo-btn">用紙を撮影</button><input type="file" id="lab-photo" accept="image/*" capture="environment" hidden>
        <span class="tag tag-warn" id="lab-photo-tag" hidden>読み取った値</span>
      </div>
      <div class="lab-grid" id="lab-grid"></div>
      <span class="error-text" data-error="values"></span>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button>
      <button type="submit" class="btn btn-primary">保存 <kbd>Ctrl+Enter</kbd></button>
    </div>
  </form>
</dialog>
</body>
</html>
