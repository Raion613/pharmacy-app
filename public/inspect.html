<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調剤監査</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<link rel="stylesheet" href="/assets/css/features.css">
<link rel="modulepreload" href="/assets/js/inspect.js">
<script type="module" src="/assets/js/router.js" data-page="/assets/js/inspect.js"></script>
</head>
<body class="app">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <nav class="crumbs"></nav>
  <section class="panel patient-band band-top" id="band"></section>
  <main class="content split inspect-page">
    <section class="panel inspect-items">
      <div class="panel-head">処方の薬<span class="count" id="item-count"></span><span class="spacer"></span><span class="hint" id="rx-date"></span></div>
      <ul class="check-items" id="check-items"></ul>
    </section>
    <section class="panel inspect-scan">
      <div class="panel-head">バーコードを読む</div>
      <div class="panel-body scan-body">
        <div class="field">
          <label for="scan-input">薬の箱のバーコード</label>
          <div class="input-icon"><span id="scan-icon"></span><input class="input scan-input" id="scan-input" autocomplete="off" spellcheck="false" placeholder="(01)14987…(17)…(10)…"></div>
          <span class="error-text" id="scan-error"></span>
        </div>
        <div class="demo-scan" id="demo-scan">
          <div class="demo-title">デモ：読み取り機の代わりに、箱のバーコードの中身を入れて読む</div>
          <div class="demo-row"><span class="hint">処方の薬</span><span id="demo-same"></span></div>
          <div class="demo-row"><span class="hint">間違い</span><span id="demo-wrong"></span></div>
        </div>
        <ol class="scan-log" id="scan-log"></ol>
        <section class="past" id="past" hidden></section>
      </div>
    </section>
  </main>
  <footer class="actionbar">
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary" id="save" disabled>監査を保存 <kbd>Ctrl+Enter</kbd></button>
  </footer>
</div>
</body>
</html>
