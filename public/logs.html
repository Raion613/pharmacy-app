<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>閲覧記録</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<script type="module" src="/assets/js/logs.js"></script>
<style>
  .logs { height: 100%; display: flex; flex-direction: column; }
  .logs .scroll { flex: 1; min-height: 0; overflow: auto; }
  .logs .grid tbody tr { cursor: default; }
  .act { font-weight: 700; }
  .act-view { color: var(--accent-strong); }
  .act-create { color: var(--ok); }
</style>
</head>
<body class="app">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <nav class="crumbs"></nav>
  <main class="content">
    <section class="panel logs">
      <div class="panel-head"><span id="title">閲覧記録</span><span class="count" id="count"></span><span class="spacer"></span><a id="clear" class="btn btn-ghost" href="/logs" hidden>全員の記録を見る</a></div>
      <p class="hint" style="padding: 8px 12px; margin: 0; border-bottom: 1px solid var(--border);">誰が・いつ・どの患者の情報を開いたかの記録です。患者の情報を返すたびにサーバーが残し、画面からは消せません。</p>
      <div class="scroll">
        <table class="grid">
          <thead><tr><th>日時</th><th>利用者</th><th>操作</th><th>患者</th><th>内容</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty" id="empty" hidden>記録はありません。</p>
      </div>
    </section>
  </main>
</div>
</body>
</html>
