<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在宅</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<link rel="stylesheet" href="/assets/css/patient.css">
<link rel="stylesheet" href="/assets/css/features.css">
<script type="module" src="/assets/js/homecare.js"></script>
</head>
<body class="app">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <nav class="crumbs"></nav>
  <main class="content split homecare-page">
    <aside class="panel home-patients" id="home-patients">
      <div class="panel-head">在宅の患者<span class="count" id="home-count"></span><span class="spacer"></span>
        <button type="button" class="btn btn-small" id="add-facility">施設を追加</button>
        <button type="button" class="btn btn-small" id="add-home">患者を登録</button></div>
      <div class="home-list" id="home-list"></div>
    </aside>
    <section class="panel home-calendar">
      <div class="panel-head">
        <button type="button" class="btn btn-small" id="prev-month" title="前の月（Alt+←）">‹</button>
        <span class="month" id="month-label"></span>
        <button type="button" class="btn btn-small" id="next-month" title="次の月（Alt+→）">›</button>
        <span class="spacer"></span>
        <label class="hint" for="report-facility">報告書</label>
        <select class="input input-small" id="report-facility"></select>
        <a class="btn btn-small" id="print-reports" data-overlay>この月の報告書を一括印刷</a>
        <button type="button" class="btn btn-small btn-primary" id="add-visit">訪問を予定 <kbd>Alt+V</kbd></button>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>
  </main>
  <footer class="actionbar">
    <div class="keys"><span><kbd>Alt</kbd>+<kbd>V</kbd>訪問を予定</span><span><kbd>Alt</kbd>+<kbd>←</kbd><kbd>→</kbd>月を移る</span><span>予定を選ぶと記録を書けます</span></div>
  </footer>
</div>

<dialog id="facility-dialog" aria-labelledby="facility-title">
  <form id="facility-form" novalidate>
    <div class="panel-head" id="facility-title">施設を追加</div>
    <div class="dialog-body">
      <div class="field"><label for="f-name">施設名</label><input class="input" id="f-name" name="name" maxlength="60"><span class="error-text" data-error="name"></span></div>
      <div class="field"><label for="f-address">住所</label><input class="input" id="f-address" name="address" maxlength="100"><span class="error-text" data-error="address"></span></div>
      <div class="field"><label for="f-phone">電話番号</label><input class="input" id="f-phone" name="phone" maxlength="20"><span class="error-text" data-error="phone"></span></div>
    </div>
    <div class="dialog-foot"><button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button><button type="submit" class="btn btn-primary">追加 <kbd>Ctrl+Enter</kbd></button></div>
  </form>
</dialog>

<dialog id="home-dialog" aria-labelledby="home-title">
  <form id="home-form" novalidate>
    <div class="panel-head" id="home-title">在宅の患者を登録</div>
    <div class="dialog-body">
      <div class="field"><label for="h-patient">患者（カナ・氏名・患者番号で探す）</label>
        <input class="input" id="h-patient-q" autocomplete="off"><select class="input" id="h-patient" name="patientId" size="4"></select><span class="error-text" data-error="patientId"></span></div>
      <div class="field"><label for="h-facility">訪問先</label><select class="input" id="h-facility" name="facilityId"></select><span class="error-text" data-error="facilityId"></span></div>
      <div class="field"><label for="h-institution">訪問を指示した医師の医療機関</label><input class="input" id="h-institution" name="institution" maxlength="60"><span class="error-text" data-error="institution"></span></div>
      <div class="field"><label for="h-doctor">医師</label><input class="input" id="h-doctor" name="doctor" maxlength="30"><span class="error-text" data-error="doctor"></span></div>
      <div class="field"><label for="h-care">ケアマネジャー</label><input class="input" id="h-care" name="careManager" maxlength="40"><span class="error-text" data-error="careManager"></span></div>
      <div class="field"><label for="h-started">訪問を始めた日</label><input class="input" type="date" max="9999-12-31" id="h-started" name="startedOn"><span class="error-text" data-error="startedOn"></span></div>
      <label class="check-row"><input type="checkbox" name="intensive" id="h-intensive">末期の悪性腫瘍・注射による麻薬の投与・中心静脈栄養法</label>
    </div>
    <div class="dialog-foot"><button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button><button type="submit" class="btn btn-primary">登録 <kbd>Ctrl+Enter</kbd></button></div>
  </form>
</dialog>

<dialog id="visit-dialog" aria-labelledby="visit-title">
  <form id="visit-form" novalidate>
    <div class="panel-head" id="visit-title">訪問を予定</div>
    <div class="dialog-body">
      <div class="field"><label for="v-patient">患者</label><select class="input" id="v-patient" name="patientId"></select><span class="error-text" data-error="patientId"></span></div>
      <div class="field"><label for="v-date">訪問日</label><input class="input" type="date" max="9999-12-31" id="v-date" name="visitOn"><span class="error-text" data-error="visitOn"></span></div>
      <div class="field"><label for="v-pharmacist">担当の薬剤師</label><select class="input" id="v-pharmacist" name="pharmacistId"></select><span class="error-text" data-error="pharmacistId"></span></div>
      <p class="hint" id="v-limit"></p>
    </div>
    <div class="dialog-foot"><button type="button" class="btn" data-close>キャンセル <kbd>Esc</kbd></button><button type="submit" class="btn btn-primary">予定に入れる <kbd>Ctrl+Enter</kbd></button></div>
  </form>
</dialog>

<dialog id="plan-dialog" class="wide" aria-labelledby="plan-title">
  <form id="plan-form" novalidate>
    <div class="panel-head" id="plan-title">薬学的管理指導計画書</div>
    <div class="dialog-body">
      <div class="plan-history" id="plan-history"></div>
      <div class="plan-row">
        <div class="field"><label for="p-made">作成日</label><input class="input" type="date" max="9999-12-31" id="p-made" name="madeOn"><span class="error-text" data-error="madeOn"></span></div>
        <div class="field"><label for="p-visits">訪問回数（月）</label><input class="input num" id="p-visits" name="visitsPerMonth" inputmode="numeric"><span class="error-text" data-error="visitsPerMonth"></span></div>
        <div class="field"><label for="p-interval">訪問間隔</label><input class="input" id="p-interval" name="intervalText" maxlength="40" placeholder="例：毎週木曜"><span class="error-text" data-error="intervalText"></span></div>
      </div>
      <div class="field"><label for="p-management">薬剤の管理方法</label><textarea class="input textarea" id="p-management" name="management" rows="2" maxlength="400"></textarea><span class="error-text" data-error="management"></span></div>
      <div class="field"><label for="p-drug">薬剤特性（副作用・相互作用等）</label><textarea class="input textarea" id="p-drug" name="drugNotes" rows="2" maxlength="400"></textarea><span class="error-text" data-error="drugNotes"></span></div>
      <div class="field"><label for="p-guidance">実施すべき指導の内容</label><textarea class="input textarea" id="p-guidance" name="guidance" rows="2" maxlength="400"></textarea><span class="error-text" data-error="guidance"></span></div>
    </div>
    <div class="dialog-foot"><a class="btn" id="print-plan" data-overlay>最新の計画書を印刷</a><span class="spacer"></span><button type="button" class="btn" data-close>閉じる <kbd>Esc</kbd></button><button type="submit" class="btn btn-primary">計画書を保存 <kbd>Ctrl+Enter</kbd></button></div>
  </form>
</dialog>

<dialog id="record-dialog" class="wide" aria-labelledby="record-title">
  <form id="record-form" novalidate>
    <div class="panel-head" id="record-title">訪問の記録</div>
    <div class="dialog-body">
      <div class="record-context" id="record-context"></div>
      <div class="visit-fields">
        <div class="field"><label for="r-storage">薬の保管状況</label><textarea class="input textarea" id="r-storage" name="storage" rows="2" maxlength="300"></textarea><span class="error-text" data-error="storage"></span></div>
        <div class="field"><label for="r-adherence">服薬状況</label><textarea class="input textarea" id="r-adherence" name="adherence" rows="2" maxlength="300"></textarea><span class="error-text" data-error="adherence"></span></div>
        <div class="field"><label for="r-leftover">残薬の状況</label><textarea class="input textarea" id="r-leftover" name="leftover" rows="2" maxlength="300"></textarea><span class="error-text" data-error="leftover"></span></div>
        <div class="field"><label for="r-guidance">実施した指導・服薬支援</label><textarea class="input textarea" id="r-guidance" name="guidance" rows="2" maxlength="400"></textarea><span class="error-text" data-error="guidance"></span></div>
      </div>
      <div class="field"><label for="r-report">処方医への報告<button type="button" class="btn btn-ghost btn-small" id="compose-report">薬歴から報告書の形にまとめる <kbd>Alt+G</kbd></button></label>
        <textarea class="input textarea" id="r-report" name="report" rows="6" maxlength="1200"></textarea><span class="error-text" data-error="report"></span></div>
      <div class="field"><label for="r-shared">他職種と共有した内容</label><textarea class="input textarea" id="r-shared" name="shared" rows="2" maxlength="400"></textarea><span class="error-text" data-error="shared"></span></div>
    </div>
    <div class="dialog-foot"><a class="btn" id="print-one" data-overlay hidden>この報告書を印刷</a><span class="spacer"></span><button type="button" class="btn" data-close>閉じる <kbd>Esc</kbd></button><button type="submit" class="btn btn-primary" id="record-save">記録を保存 <kbd>Ctrl+Enter</kbd></button></div>
  </form>
</dialog>
</body>
</html>
