<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレーシングレポート</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<link rel="stylesheet" href="/assets/css/print.css">
<link rel="stylesheet" href="/assets/css/features.css">
<script type="module" src="/assets/js/tracing.js"></script>
</head>
<body class="app" id="page">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <nav class="crumbs"></nav>
  <main class="content tracing-page">
    <form class="panel tracing-form" id="tracing-form" novalidate>
      <div class="panel-head">トレーシングレポート（服薬情報提供書）を作る<span class="spacer"></span>
        <button type="button" class="btn btn-small" id="fill">薬歴から写す <kbd>Alt+W</kbd></button></div>
      <div class="panel-body tracing-body">
        <div class="tracing-to">
          <div class="field"><label for="t-institution">医療機関</label><input class="input" id="t-institution" name="institution" maxlength="60"><span class="error-text" data-error="institution"></span></div>
          <div class="field"><label for="t-department">診療科</label><input class="input" id="t-department" name="department" maxlength="30"><span class="error-text" data-error="department"></span></div>
          <div class="field"><label for="t-doctor">処方医</label><input class="input" id="t-doctor" name="doctor" maxlength="30"><span class="error-text" data-error="doctor"></span></div>
          <div class="field"><label for="t-next">次回受診日</label><input class="input" type="date" max="9999-12-31" id="t-next" name="nextVisitOn"><span class="error-text" data-error="nextVisitOn"></span></div>
        </div>
        <div class="field">
          <span class="label" id="consent-label">患者の同意</span>
          <div class="radio-row" role="radiogroup" aria-labelledby="consent-label">
            <label><input type="radio" name="consent" value="agreed">患者の同意のもと報告する</label>
            <label><input type="radio" name="consent" value="necessary">同意はないが、治療上必要なため報告する</label>
          </div>
          <span class="error-text" data-error="consent"></span>
        </div>
        <div class="tracing-sections" id="sections"></div>
      </div>
      <div class="panel-foot">
        <a class="btn" id="back">薬歴へ戻る</a>
        <span class="spacer"></span>
        <button type="submit" class="btn btn-primary">保存して印刷する <kbd>Ctrl+Enter</kbd></button>
      </div>
    </form>
  </main>
</div>
<div class="print-bar tracing-print-bar" hidden><b>トレーシングレポート</b><a class="btn" id="print-back">薬歴へ戻る</a><span class="spacer"></span>
  <button type="button" class="btn btn-primary" id="print">印刷する <kbd>Ctrl+P</kbd></button></div>
<main class="sheet" id="sheet" hidden></main>
</body>
</html>
