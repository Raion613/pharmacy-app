<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薬局の数字</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<link rel="stylesheet" href="/assets/css/features.css">

<body class="app">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <nav class="crumbs"></nav>
  <main class="content stats-page">
    <div class="stats-filter">
      <div class="field"><label for="to-month">いつまで（12か月分）</label><input class="input" type="month" id="to-month"></div>
    </div>
    <section class="stat-tiles" id="tiles"></section>
    <section class="charts" id="charts"></section>
    <section class="panel stats-table">
      <div class="panel-head">月ごとの数字（表）</div>
      <div class="scroll"><table class="grid" id="table"></table></div>
      <p class="hint stats-note">処方箋単価 ＝ 合計点数 × 10円 ÷ 枚数（保険の分）<br>
        後発品使用割合 ＝ 後発品 ÷（後発品のある先発品 ＋ 後発品）（数量ベース）</p>
    </section>
    <div class="chart-tip" id="tip" role="tooltip" hidden></div>
  </main>
</div>
