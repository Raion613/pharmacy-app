<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>処方入力</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<link rel="stylesheet" href="/assets/css/patient.css">
<link rel="stylesheet" href="/assets/css/rx.css">
<link rel="modulepreload" href="/assets/js/rx.js">
<script type="module" src="/assets/js/router.js" data-page="/assets/js/rx.js"></script>
</head>
<body class="app">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <nav class="crumbs"></nav>
  <section class="panel patient-band band-top" id="band"></section>
  <main class="content split">
    <section class="panel rx-form">
      <div class="panel-head dates">
        <div class="date-field">
          <label for="prescribed-on">処方日</label>
          <input class="input" type="date" max="9999-12-31" id="prescribed-on">
        </div>
        <div class="date-field">
          <label for="dispensed-on">調剤日</label>
          <input class="input" type="date" max="9999-12-31" id="dispensed-on">
        </div>
        <div class="date-field">
          <label for="handbook">お薬手帳</label>
          <select class="input" id="handbook">
            <option value="paper">提示あり（紙）</option>
            <option value="electronic">提示あり（電子版）</option>
            <option value="none">提示なし</option>
          </select>
        </div>
        <span class="tag tag-warn" id="revision-tag" hidden></span>
        <span class="error-text" id="date-error"></span>
        <span class="spacer"></span>
        <span class="hint" id="do-note" hidden></span>
        <button type="button" class="btn btn-small" id="do-last" title="Alt+D">前回の処方を写す</button>
      </div>
      <div class="rps" id="rps"></div>
      <div class="add-rp-row">
        <button type="button" class="btn" id="add-rp" title="Alt+R">剤を追加</button>
      </div>
      <section class="rx-inquiries" id="rx-inquiries" hidden>
        <h2>処方全体の疑義照会</h2>
        <div class="inq-lines" data-target="all"></div>
      </section>
    </section>

    <aside class="panel rx-summary">
      <div class="panel-head">会計</div>
      <div class="panel-body summary-body">
        <div class="total-box">
          <span class="label">薬剤料</span>
          <span class="total num" id="total">—</span>
          <span class="yen num" id="total-yen"></span>
        </div>
        <p class="hint" id="total-note"></p>
        <ol class="rp-points" id="rp-points"></ol>

        <div class="bill" id="bill">
          <dl class="bill-sections">
            <div><dt>調剤技術料</dt><dd class="num" id="bill-tech">—</dd></div>
            <div><dt>薬学管理料</dt><dd class="num" id="bill-mgmt">—</dd></div>
            <div><dt>薬剤料</dt><dd class="num" id="bill-drug">—</dd></div>
            <div><dt>その他</dt><dd class="num" id="bill-other">—</dd></div>
            <div class="sum"><dt>合計</dt><dd class="num" id="bill-total">—</dd></div>
            <div><dt id="bill-burden-label">一部負担金</dt><dd class="num" id="bill-copay">—</dd></div>
            <div class="kohi-rows" id="bill-kohi"></div>
            <div><dt>保険外（選定療養）</dt><dd class="num" id="bill-special">—</dd></div>
            <div class="charge"><dt>窓口で受け取る額</dt><dd class="num" id="bill-charge">—</dd></div>
          </dl>
          <details class="bill-lines"><summary>算定する項目</summary><ul id="bill-lines"></ul></details>
          <p class="hint" id="bill-note"></p>
        </div>

        <section class="peds" id="peds" hidden>
          <div class="peds-head">小児の分量<span class="hint" id="peds-weight"></span></div>
          <div class="peds-weight-form" id="peds-weight-form">
            <label for="peds-weight-input">体重</label>
            <input class="input num" id="peds-weight-input" inputmode="decimal" autocomplete="off"><span>kg</span>
            <button type="button" class="btn btn-small" id="peds-weight-save">体重を保存</button>
          </div>
          <ul id="peds-list"></ul>
        </section>

        <div class="errors" id="errors" hidden>
          <div class="errors-head">保存できません</div>
          <ul id="error-list"></ul>
        </div>
      </div>
    </aside>
  </main>
  <footer class="actionbar">
    <span class="spacer"></span>
    <button type="button" class="btn" id="edit-memo" title="Alt+E">メモ帳</button>
    <button type="button" class="btn btn-primary" id="save" title="Ctrl+Enter">保存</button>
  </footer>
</div>

<ul class="suggest" id="suggest" role="listbox" hidden></ul>
<dialog id="inquiry-dialog" class="inquiry-dialog" aria-labelledby="inquiry-title">
  <form id="inquiry-form" novalidate>
    <div class="panel-head" id="inquiry-title">疑義照会</div>
    <div class="dialog-body">
      <div class="field"><label for="inq-target">どの薬について</label><select class="input" id="inq-target" name="target"></select></div>
      <div class="field"><label for="inq-kind">種類</label>
        <select class="input" id="inq-kind" name="kind">
          <option value="leftover">残薬調整</option>
          <option value="adverse">重複投薬・相互作用など</option>
        </select></div>
      <div class="field"><label for="inq-content">問い合わせた内容</label>
        <textarea class="input" id="inq-content" name="content" rows="3" maxlength="400" placeholder="例：ロスバスタチン錠が7日分残っている。28日分を21日分に減らしてよいか"></textarea></div>
      <div class="field"><label for="inq-answer">処方医の回答</label>
        <textarea class="input" id="inq-answer" name="answer" rows="2" maxlength="400" placeholder="例：21日分で可"></textarea></div>
      <div class="field"><label for="inq-changed">回答で処方が</label>
        <select class="input" id="inq-changed" name="changed">
          <option value="1">変わった</option>
          <option value="0">変わらなかった</option>
        </select></div>
      <div class="field" id="inq-short-field"><label for="inq-short">6日分以下に減らした理由</label>
        <input class="input" id="inq-short" name="shortReason" maxlength="200" placeholder="残薬調整で6日分以下にしたときだけ（明細書に書く）"></div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-ghost" id="inq-remove">この照会を消す</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close title="Esc">やめる</button>
      <button type="submit" class="btn btn-primary" title="Ctrl+Enter">記録する</button>
    </div>
  </form>
</dialog>
</body>
</html>
