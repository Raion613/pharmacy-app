<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受付状況</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/tour.css">
<link rel="stylesheet" href="/assets/css/features.css">
<link rel="modulepreload" href="/assets/js/board.js">
<script type="module" src="/assets/js/router.js" data-page="/assets/js/board.js"></script>
</head>
<body class="app">
<nav class="sidebar"></nav>
<div class="main">
  <header class="topbar"></header>
  <nav class="crumbs"></nav>
  <main class="content board-page">
    <section class="panel board-top">
      <div class="panel-body board-controls">
        <div class="field">
          <label for="board-date">日付</label>
          <input class="input" type="date" max="9999-12-31" id="board-date">
        </div>
        <div class="field reception-search">
          <label for="reception-q">処方箋を受け付ける（患者番号・カナ・氏名）</label>
          <div class="input-icon"><span id="search-icon"></span><input class="input" id="reception-q" autocomplete="off" placeholder="例：アオキ　→ ↑↓で選び Enter"></div>
          <ul class="suggest board-suggest" id="reception-suggest" role="listbox" hidden></ul>
        </div>
        <span class="spacer"></span>
        <dl class="board-summary" id="board-summary"></dl>
      </div>
    </section>
    <section class="board" id="board" aria-label="業務の進み具合"></section>
  </main>
</div>
</body>
</html>
